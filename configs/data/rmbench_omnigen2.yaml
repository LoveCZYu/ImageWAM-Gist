train:
  _target_: imagewam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
    - ${oc.env:IMAGEWAM_RMBENCH_LEROBOT_ROOT,./data/rmbench_lerobot/rmbench}
  shape_meta:
    images:
      - key: cam_high
        raw_shape: [3, 240, 320]
        shape: [3, 240, 320]
      - key: cam_left_wrist
        raw_shape: [3, 240, 320]
        shape: [3, 240, 320]
      - key: cam_right_wrist
        raw_shape: [3, 240, 320]
        shape: [3, 240, 320]
    action:
      - key: default
        raw_shape: 14
        shape: 14
    state:
      - key: default
        raw_shape: 14
        shape: 14
  num_frames: 17
  global_sample_stride: 1
  action_video_freq_ratio: 1
  video_size: [288, 256]
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  pretrained_norm_stats: null
  skip_padding_as_possible: false
  concat_multi_camera: "robotwin"
  robotwin_camera_layout: "compact_288x256"
  lerobot_video_backend: pyav
  video_augmentation:
    _target_: imagewam.datasets.lerobot.transforms.image.VideoAugmentation
    p: 0.5
    augment_types: [corrupt_only, color_only, both]
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
      hue: 0.03
    gamma:
      range: [0.9, 1.1]
    gaussian_noise:
      std: 0.01
    random_resized_crop:
      scale: [0.95, 1.0]
      ratio: preserve
    rotate:
      degrees: 5.0
      fill: mean
  require_text_cache: false
  endpoint_frames_only: true
  edit_memory_drop_incomplete_current: false
  nonidle_filter_path: null
  qwen_text_cache_dir: ${oc.env:IMAGEWAM_RMBENCH_QWEN_CACHE,./data/rmbench_lerobot/qwen_cache_omnigen2}
  qwen_context_len: 128
  processor:
    _target_: imagewam.datasets.lerobot.processors.imagewam_processor.ImageWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    image_obs_steps: 2
    num_output_cameras: 3
    action_output_dim: 14
    proprio_output_dim: 14
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: "z-score"
    norm_exception_mode: null
    action_state_merger:
      _target_: imagewam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: imagewam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
    val_transforms:
      - _target_: imagewam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
  text_embedding_cache_dir: null
  context_len: 128

val:
  _target_: imagewam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs: ${data.train.dataset_dirs}
  shape_meta: ${data.train.shape_meta}
  num_frames: ${data.train.num_frames}
  global_sample_stride: ${data.train.global_sample_stride}
  action_video_freq_ratio: ${data.train.action_video_freq_ratio}
  video_size: ${data.train.video_size}
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: false
  pretrained_norm_stats: null
  skip_padding_as_possible: false
  concat_multi_camera: ${data.train.concat_multi_camera}
  robotwin_camera_layout: ${data.train.robotwin_camera_layout}
  lerobot_video_backend: ${data.train.lerobot_video_backend}
  video_augmentation: null
  require_text_cache: false
  endpoint_frames_only: ${data.train.endpoint_frames_only}
  edit_memory_drop_incomplete_current: false
  nonidle_filter_path: null
  qwen_text_cache_dir: ${data.train.qwen_text_cache_dir}
  qwen_context_len: ${data.train.qwen_context_len}
  processor:
    _target_: imagewam.datasets.lerobot.processors.imagewam_processor.ImageWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    image_obs_steps: 2
    num_output_cameras: 3
    action_output_dim: 14
    proprio_output_dim: 14
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: "z-score"
    norm_exception_mode: null
    action_state_merger:
      _target_: imagewam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
      - _target_: imagewam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
    val_transforms:
      - _target_: imagewam.datasets.lerobot.transforms.image.ToTensor
      - _target_: torchvision.transforms.Resize
        size: [240, 320]
  text_embedding_cache_dir: null
  context_len: 128
